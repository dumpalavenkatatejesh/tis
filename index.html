<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tula’s International School (TIS) · Dehradun</title>
    <meta
      name="description"
      content="Tula’s International School is a co-educational CBSE boarding and day school in Dehradun. Explore the 22-acre campus, seven houses, and admissions for Classes IV–IX and XI."
    />
    <meta name="theme-color" content="#f7f4ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,640;1,9..144,520;1,9..144,640&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #f7f4ee; }
      html.dark { background: #101915; }
    </style>
    <script>
      (function () {
        try {
          var key = "tis-theme";
          var theme = localStorage.getItem(key);
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "dark" ? "#101915" : "#f7f4ee";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
